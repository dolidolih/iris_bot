name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'  # Only run on main push

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ secrets.DOCKER_USERNAME }}/yoonmini-bot:latest

  deploy-to-server:
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        port: ${{ secrets.PORT || 22 }}
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/yoonmini-bot:latest
          
          # Function to deploy a bot instance
          deploy_bot() {
            local ID=$1
            local URL=$2
            
            if [ -n "$URL" ]; then
              echo "Deploying yoonmini-bot-$ID..."
              docker stop yoonmini-bot-$ID || true
              docker rm yoonmini-bot-$ID || true
              docker run -d \
                --name yoonmini-bot-$ID \
                --restart unless-stopped \
                --network host \
                -e IRIS_URL="$URL" \
                ${{ secrets.DOCKER_USERNAME }}/yoonmini-bot:latest
            else
              echo "Skipping yoonmini-bot-$ID (Secret not set)"
            fi
          }

          # Deploy up to 3 bots if secrets exist
          # IRIS_URL (Legacy/Default) -> mapped to bot-1 if IRIS_URL_1 is empty, or handle as main
          # Let's standardize: Try IRIS_URL_1, IRIS_URL_2, IRIS_URL_3.
          # Fallback: If IRIS_URL_1 is empty but IRIS_URL is set, use IRIS_URL for bot-1.
          
          URL_1="${{ secrets.IRIS_URL_1 }}"
          if [ -z "$URL_1" ]; then URL_1="${{ secrets.IRIS_URL }}"; fi
          
          deploy_bot 1 "$URL_1"
          deploy_bot 2 "${{ secrets.IRIS_URL_2 }}"
          deploy_bot 3 "${{ secrets.IRIS_URL_3 }}"


